experiment:
  name: anchorbank_pairwise_homography_warmup_long
  description: Long synthetic two-view homography warm-up using MegaDepth-1500 images to avoid idle GPU while bootstrapping Stage-0

model:
  backbone:
    model_name: dinov2_vits14
    pretrained: false
    weights: /gemini/code/FSPT/weights/dinov2/dinov2_vits14_pretrain.pth
    out_indices: [8, 10, 11]
    train_backbone: false
  adapter:
    hidden_dim: 256
    out_dim: 256
    fuse_mode: mean
    base_stride: 14
  matcher:
    hidden_dim: 256
    topk: 5
    temperature: 0.07
    position_bias_strength: 0.1
    position_bias_sigma: 0.25
    use_context_mixer: true

data:
  image_root: /gemini/code/datasets/megadepth/extracted/megadepth1500/images
  image_size: [224, 224]
  num_points: 32
  jitter_ratio: 0.20
  val_fraction: 0.1
  photometric_jitter: 0.2
  train_repeat_factor: 512

loss:
  heatmap: 1.0
  coordinate: 1.0

training:
  batch_size: 4
  val_batch_size: 4
  num_workers: 4
  lr: 2.0e-4
  weight_decay: 1.0e-4
  max_steps: 400000
  log_interval: 200
  eval_interval: 5000
  save_interval: 5000

