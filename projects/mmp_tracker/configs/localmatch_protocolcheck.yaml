experiment:
  name: mmp_localmatch_protocolcheck
  description: Minimal smoke config for matching-first local baseline
model:
  variant: local
  encoder:
    in_channels: 3
    base_dim: 64
    out_dim: 128
  local_matcher:
    radius: 4
    temperature: 0.07
  global_relocator:
    topk: 0
    temperature: 0.07
    memory_size: 1
  posterior_fusion:
    hidden_dim: 64
    type_embed_dim: 8
    min_visibility: 0.0
  tracking:
    feature_stride: 4
    forward_only: true
    visibility_update_threshold: 0.5
    template_momentum: 0.8
    anchor_mix: 0.35
    global_use_margin: 0.05
    long_occ_min_frames: 3
    long_occ_recovery_window: 1
loss:
  coordinate:
    weight: 1.0
  local_heatmap:
    weight: 0.2
  visibility:
    weight: 0.2
  temporal_smoothness:
    weight: 0.05
data:
  train:
    dataset: tapvid_kinetics
    root: /gemini/code/datasets/tapvid_kinetics
    subset: smoke
  val:
    dataset: tapvid_davis
    root: /gemini/code/datasets/tapvid_davis
    resolution:
    - 256
    - 256
    query_mode: first
    first_frame_query: false
training:
  epochs: 1
  batch_size: 1
  accumulation_steps: 1
  lr: 0.0001
