experiment:
  name: anchorbank_pairwise_homography_warmup_smoke
  description: Synthetic two-view homography warm-up smoke using MegaDepth-1500 images
model:
  backbone:
    model_name: dinov2_vits14
    pretrained: false
    weights: /gemini/code/FSPT/weights/dinov2/dinov2_vits14_pretrain.pth
    out_indices:
    - 8
    - 10
    - 11
    train_backbone: false
  adapter:
    hidden_dim: 256
    out_dim: 256
    fuse_mode: mean
    base_stride: 14
  matcher:
    hidden_dim: 256
    topk: 5
    temperature: 0.07
    position_bias_strength: 0.1
    position_bias_sigma: 0.25
    use_context_mixer: true
data:
  image_root: /gemini/code/datasets/megadepth/extracted/megadepth1500/images
  image_size:
  - 224
  - 224
  num_points: 32
  jitter_ratio: 0.2
  val_fraction: 0.1
  photometric_jitter: 0.2
  train_repeat_factor: 2
loss:
  heatmap: 1.0
  coordinate: 1.0
training:
  batch_size: 4
  val_batch_size: 4
  num_workers: 0
  lr: 0.0002
  weight_decay: 0.0001
  max_steps: 3
  log_interval: 1
  eval_interval: 3
  save_interval: 100
