schema_version: routeD_discrete_hypothesis_support_audit_gate3a_v0
date: 2026-07-19

experiment:
  name: routeD_csrr_discrete_hypothesis_support_audit_gate3a
  purpose: >-
    Determine whether the frozen Gate 2 learned correlation maps already contain
    a useful discrete candidate near the fresh-state teacher coordinate, and
    whether coordinate-oracle selection from that frozen candidate set is
    sufficient to recover future utility. No candidate selector or action gate
    is trained in this audit.
  claim_scope: fit-only candidate-support diagnosis

frozen_gate2_model:
  config: /gemini/code/FSPT_v9a60_clean/configs/routeD_counterfactual_state_restorer_gate2_v0.yaml
