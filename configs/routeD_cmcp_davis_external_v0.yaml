formal_decisions:
  pass: AUTHORIZE_STRONG_BACKBONE_EXTERNAL_TRANSFER_CLAIM
  fail: STOP_STRONG_BACKBONE_EXTERNAL_CLAIM_AND_RETAIN_SYNTHETIC_EVIDENCE_ONLY

stop_rules:
  - Do not change checkpoint, normalization, candidate extraction, NMS, EMA, top-K, or comparator rule after any DAVIS read.
  - Do not calibrate or select a threshold on DAVIS.
  - Do not print or inspect partial DAVIS performance.
  - Do not select videos, frames, points, or a checkpoint using DAVIS results.
  - If any gate fails, report the failure and retain only Kubric strong-backbone evidence.
  - Do not use a DAVIS failure to justify a rescue sweep.
  - Do not rerun or retune the official 1,144-video Kinetics result.

kinetics_lock:
  official_1144_result: frozen_historical_evidence
  rerun: forbidden
  tuning_use: forbidden
