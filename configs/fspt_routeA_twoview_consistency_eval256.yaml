# =============================================================================
# Route A: two-view spatial consistency (self-supervised, eval256)
# =============================================================================
#
# Motivation (paper-backed)
# - Synthetic->real or cross-dataset generalization tends to fail because the model
#   latches onto domain-specific cues. Recent strong trackers rely heavily on
#   self-training / consistency objectives on real videos.
#
# What we do
# - Enable the built-in loss.two_view_consistency regularizer in train.py.
# - It creates two randomly warped views of the same clip and enforces that the
#   student prediction matches an EMA teacher after mapping back to the original
#   coordinate system.
#
# This is intentionally ablation-friendly: no architecture changes.
#

defaults:
  - fspt_routeA_ms_corr_fnet_c2_corrproj_query_aggressive_eval256.yaml
  - _self_

experiment:
  name: "fspt_routeA_twoview_consistency_eval256"
  description: "Route A: enable two-view spatial consistency regularizer (EMA teacher) @eval256"

loss:
  two_view_consistency:
    enabled: true

    # Main track consistency weight; keep conservative to avoid destabilizing
    # already-strong base behavior.
    weight: 0.5
    schedule:
      enabled: true
      type: "cosine"
      start_weight: 0.0
      end_weight: 0.5
      start_epoch: 2
      end_epoch: 10

    # Optional visibility consistency; keep off unless needed.
    visibility_weight: 0.0

    teacher: "ema"
    stop_grad: true
    require_base_tracks: true

    # Reduce overhead.
    apply_prob: 0.5
    max_points: 128
    max_resample: 1
    min_in_bounds_fraction: 0.7
    oom_safe: true

    augmentation:
      flip: true
      flip_prob: 0.5
      rotation_deg: 5.0
      scale: [0.9, 1.1]
      translate: [0.05, 0.05]
      padding_mode: "zeros"
      mode: "bilinear"
      align_corners: false

