# =============================================================================
# FSPT: Resume from formal historical best + aligned late unfreeze
# =============================================================================

defaults:
  - fspt_oa_focus
  - _self_

experiment:
  name: "fspt_oa_from_formal_best_lateclip"
  description: "Resume from formal best checkpoint; align late-stage partial CLIP unfreeze"

evaluation:
  metric_resolution_mode: "original"

training:
  optimizer:
    lr: 3.0e-5
    clip_lr_scale: 0.03

  phase_schedule:
    enabled: true
    phases:
      - name: "warmup_heads"
        start_epoch: 0
        freeze_modules:
          - "geo_backbone.backbone.layer1"
          - "geo_backbone.backbone.layer2"
          - "semantic_encoder.clip_model"
        unfreeze_modules: []
        trainable_modules: []
        lr_scale_overrides:
          other: 1.0
          semantic: 1.0
          clip: 0.0

      - name: "full_finetune"
        start_epoch: 8
        freeze_modules:
          - "semantic_encoder.clip_model"
        unfreeze_modules:
          - "geo_backbone.backbone.layer1"
          - "geo_backbone.backbone.layer2"
        trainable_modules: []
        lr_scale_overrides:
          other: 1.0
          semantic: 0.7
          clip: 0.0

      - name: "late_clip_visual_last4"
        # Realigned: when resuming from epoch 16(best), training starts at epoch 17.
        start_epoch: 17
        freeze_modules: []
        unfreeze_modules:
          - "geo_backbone.backbone.conv1"
          - "geo_backbone.backbone.bn1"
          - "semantic_encoder.clip_model.visual.transformer.resblocks.8"
          - "semantic_encoder.clip_model.visual.transformer.resblocks.9"
          - "semantic_encoder.clip_model.visual.transformer.resblocks.10"
          - "semantic_encoder.clip_model.visual.transformer.resblocks.11"
          - "semantic_encoder.clip_model.visual.ln_post"
        trainable_modules: []
        lr_scale_overrides:
          other: 1.0
          semantic: 0.7
          clip: 1.0
