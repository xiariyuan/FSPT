# Smoke test: learned recovery head integrated into online pipeline

defaults:
  - fspt_online_recovery_dino_real_eval256
  - _self_

experiment:
  name: fspt_online_recovery_learned_head_smoke
  description: Online eval with learned recovery head replacing raw DINO cosine

model:
  refiner:
    online_recovery:
      enabled: true
      search:
        feature_source: "dino"
        use_learned_head: true
        learned_head_checkpoint: "checkpoints/online_recovery_head_m0/best.pth"
      retracking:
        enabled: true
        min_conf: 0.005
    retracking:
      enabled: true
      min_conf: 0.005
