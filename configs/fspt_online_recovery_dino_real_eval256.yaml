# DINO recovery real eval on TAP-Vid DAVIS

defaults:
  - fspt_online_recovery_real_eval256
  - _self_

experiment:
  name: fspt_online_recovery_dino_real_eval256
  description: Real eval with DINO recovery-only feature source

model:
  refiner:
    online_recovery:
      enabled: true
      search:
        feature_source: "dino"
        dino_weights: ""
        dino_stride: 14
      retracking:
        enabled: true
        min_conf: 0.001
    retracking:
      enabled: true
      min_conf: 0.001
