# =============================================================================
# Route A smoke method: dual all-pair + relocal bank + two-view (eval256, fast)
# =============================================================================
#
# Purpose
# - Fast sanity run for the current best innovation direction.
# - Same protocol as the baseline smoke, with only the extra relocalization and
#   two-view regularization terms enabled.
#

defaults:
  - fspt_routeA_allpair_dual_reloc_twoview_eval256.yaml
  - _self_

experiment:
  name: "fspt_routeA_allpair_dual_reloc_twoview_smoke256_tvactive"
  description: "Route A smoke method (warm-start fixed): dual all-pair + relocal bank + active two-view @eval256"

# Override the inherited dead path with an existing compatible checkpoint.
pretrained: /gemini/code/FSPT/checkpoints/fspt_routeA_kinetics_guardrail_eval256_20260505_182156/best_aj.pth

data:
  train:
    max_samples: 256

training:
  epochs: 1
  num_workers: 0
  data_loading:
    use_prefetch: false
    pin_memory: false
    persistent_workers: false
    prefetch_factor: 2
evaluation:
  num_workers: 0
  compare_base: true
  query_mode: "strided"
  exclude_query_frame: true
  metric_resolution_mode: "input"
  aux_metric_resolution_mode: "original"
  long_occlusion_subset:
    enabled: true
    thresholds: [10, 20, 30]

loss:
  two_view_consistency:
    enabled: true
    weight: 0.4
    schedule:
      enabled: true
      type: "none"
      unit: "epoch"
      start_epoch: 0
      end_epoch: 0
      start_weight: 0.4
      end_weight: 0.4
    apply_prob: 1.0
    max_points: 64
    max_resample: 1
    min_in_bounds_fraction: 0.7
    oom_safe: true
    visibility_weight: 0.0

logging:
  wandb:
    enabled: false
  visualize:
    enabled: false
