defaults:
  - fspt_distill_ensemble_masked_median_2026-06-26

experiment:
  name: "fspt_distill_ensemble_masked_median_lowmemC_2026_06_26"
  description: "C-tier capacity smoke: preserve frequency and semantic modules, disable multiscale, refinement=1. Tests whether near-paper FSPT idea fits on 11GB GPU."

model:
  backbone:
    use_multiscale: false
  frequency:
    enabled: true
    num_bands: 4
    kernel_size: 7
    strict_lfd: false
  semantic:
    enabled: true
    modulation_type: multiplicative
    fusion_type: cross_attention
    cache:
      enabled: false
  temporal:
    num_refinement_iters: 1
    use_gradient_checkpointing: true
  occlusion:
    use_semantic_propagation: true

# Keep clean distillation semantics; reduce input memory only.
data:
  train:
    resolution: [256, 256]
  val:
    resolution: [256, 256]
