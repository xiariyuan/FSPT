schema_version: routeD_temporal_identity_data_gate3c0_v0
date: 2026-07-19

purpose: >-
  Materialize a raw-record-disjoint Kubric development population large enough
  to train and audit a candidate-conditioned spatiotemporal identity model after
  Gate 3A v1 rejected static top-eight representations.

source:
  tfds_root: /gemini/code/datasets/tapvid_kubric
  split: train
  available_tfrecord_shards: 1024
  preprocessor: /gemini/code/FSPT_v9a60_clean/scripts/preprocess_kubric_tfrecord_no_tf.py
  preprocessor_sha256: 3f92997ed961f9f3067735a43cece90fbb6794c0ce5dfb2b691632e5977c352b
  hash_source_files: true

materialization:
  output_dir: /gemini/code/FSPT/outputs/routeD_temporal_identity_kubric512_seed42_20260719
  max_samples: 512
  num_points: 64
  shard_size: 16
  sampling_strategy: uniform
  hard_fraction: 0.5
  seed: 42
  expected_frames: 24
  expected_resolution: [256, 256]

overlap_contract:
  frozen_existing_manifest: /gemini/code/FSPT/outputs/beliefcal_mvp1_a2_protocol_run_20260714/kubric_train/train.index.json
  frozen_existing_manifest_sha256: bedc1678fccfeb89ea081bf006dc28b4fb37deae1f226d39cb37a68195d0eb14
  expanded_indices_corresponding_to_existing_raw_records: [0, 63]
  expanded_indices_0_63_use: overlap_verification_only
  training_or_selection_use_of_indices_0_63: false
  exact_first_64_sample_tensor_hash_verification_required: true

partition:
  gradient_train: [64, 383]
  checkpoint_selection: [384, 447]
  fit_only_internal_audit: [448, 511]
  partition_unit: raw_video_record
  video_overlap_allowed: false
  point_resampling_does_not_override_video_exclusion: true

coarse_candidate_bank:
  representation: M1_geometry_native
  mandatory_native_candidate_zero: true
  nonnative_top_k: 128
  nms_shape: square_chebyshev
  nms_radius_grid_cells: 3
  local_refinement_window_grid_cells: 5
  local_softmax_temperature: 0.05
  deduplicate_radius_input_px: 4.0
  rationale: >-
    Post-Gate-3A fit-only diagnosis measured 0.9125 recall within 12 px and
    6.827 px median error for this bank. This observation defines a development
    proposal bank and is not a validation result.

model_scope:
  required_mechanism: candidate_conditioned_spatiotemporal_identity
  observed_frames: [0, 15]
  future_frames_available_to_model: false
  teacher_available_to_candidate_features: false
  allowed_frozen_encoders:
    cotracker3_scaled_online:
      checkpoint: /gemini/code/FSPT/baselines/cotracker/checkpoints/scaled_online.pth
      checkpoint_sha256: 205d34789f19699d64b22cf93f9b697f15f28d4025240e31532e504109837218
    dinov3_vits16plus:
      weights: /gemini/code/FSPT/third_party_weights/dinov3/facebook_dinov3_vits16plus_pretrain_lvd1689m/model.safetensors
      weights_sha256: 208146e499dace99e4c9376ddb8a26f77d64c31c46c4dc4b86ff8bc63b0235e2
  prohibited_shortcuts:
    - static scalar fusion weight search
    - teacher-conditioned candidate generation
    - future rollout features
    - model-validation threshold tuning

data_gate:
  complete_512_samples_required: true
  exact_partition_membership_required: true
  source_file_hashes_required: true
  first_64_overlap_verification_required: true
  all_new_development_records_raw_disjoint_from_existing_64: true

locked_data:
  original_model_validation_indices_48_63_read: false
  calibration_read: false
  final_holdout_read: false
  tapvid_davis_read: false
  tapvid_kinetics_read: false
  official_kinetics_1144_rerun: false

formal_decisions:
  data_gate_pass: AUTHORIZE_GATE3C1_CAUSAL_FEATURE_CACHE_ON_EXPANDED_KUBRIC
  data_gate_fail: STOP_AND_REPAIR_DATA_IDENTITY_BEFORE_MODELING
