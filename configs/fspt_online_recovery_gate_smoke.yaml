# M1 Online Recovery Gate smoke config
# Uses existing real eval config as base, adds gate fields

defaults:
  - fspt_online_recovery_real_eval256
  - _self_

experiment:
  name: fspt_online_recovery_gate_smoke
  description: Smoke test for M1 learned gate on online recovery

model:
  refiner:
    online_recovery:
      enabled: true
      search:
        feature_source: "cotracker"
      retracking:
        enabled: true
        min_conf: 0.005
    retracking:
      enabled: true
      min_conf: 0.005
