# =============================================================================
# Route A Stage-3 v24 (eval-only): long-occ>=30 focus AFTER re-appearance (window=32)
# =============================================================================
#
# Same as v23 but limits focus to a short window after re-appearance.
# This can further reduce false-positive damage at the cost of long-occ recall.
#

defaults:
  - fspt_routeA_stage3_relocal_longocc_m20_v6_from_v5_l30.yaml
  - _self_

experiment:
  name: fspt_routeA_stage3_relocal_longocc_m20_v24_focus_longocc30_afterreapp_w32_nf000_eval_from_v6best
  description: "Eval-only: focus long-occ>=30 AFTER re-appearance (32 frames); non_focus_scale=0"

pretrained: checkpoints/fspt_routeA_stage3_relocal_accept_visiblebank_l30_eval256_from_kinetics_guardrail/best.pth

model:
  refiner:
    visibility_prior:
      mode: blend
      alpha: 1.0

    focus_corrections:
      enabled: true
      non_focus_scale: 0.0
      use_relocal_mask: false

      use_long_occlusion_query: true
      long_occlusion_len: 30
      long_occlusion_vis_threshold: 0.5
      long_occlusion_apply_window_after_reappear: 32

      use_corr_conf: false
      use_relocal_conf: false
      include_occluded: false

evaluation:
  compare_base: true

