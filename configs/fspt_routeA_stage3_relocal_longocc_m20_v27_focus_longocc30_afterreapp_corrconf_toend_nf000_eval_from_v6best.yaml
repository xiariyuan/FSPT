# =============================================================================
# Route A Stage-3 v27 (eval-only): long-occ>=30 focus AFTER re-appearance (to end)
#   Re-appearance is detected via corr_conf (not base visibility).
# =============================================================================
#
# Goal:
# - Keep the strong long-occ gains from v6/v16 (~+0.004~0.005 AJ_longocc30_delta)
# - Reduce global harm by avoiding perturbations before re-appearance
# - Fix v23/v24 failure mode where base_visibility does not flip to visible
#
# Mechanism:
# - non_focus_scale=0.0 => non-focus queries stay identical to base.
# - long-occ queries: allow corrections only AFTER re-appearance following a
#   long occlusion run (>=30 frames).
# - Re-appearance uses corr_conf >= threshold, so it can trigger even when
#   base visibility remains low on the reappearance frames.
#

defaults:
  - fspt_routeA_stage3_relocal_longocc_m20_v6_from_v5_l30.yaml
  - _self_

experiment:
  name: fspt_routeA_stage3_relocal_longocc_m20_v27_focus_longocc30_afterreapp_corrconf_toend_nf000_eval_from_v6best
  description: "Eval-only: focus long-occ>=30 AFTER re-appearance (corr_conf); non_focus_scale=0"

# Only used if you train from config; evaluation uses --checkpoint.
pretrained: checkpoints/fspt_routeA_stage3_relocal_accept_visiblebank_l30_eval256_from_kinetics_guardrail/best.pth

model:
  refiner:
    visibility_prior:
      mode: blend
      alpha: 1.0

    focus_corrections:
      enabled: true
      non_focus_scale: 0.0
      use_relocal_mask: false

      use_long_occlusion_query: true
      long_occlusion_mode: max_run
      long_occlusion_len: 30
      long_occlusion_vis_threshold: 0.5
      long_occlusion_apply_window_after_reappear: -1  # to end-of-video
      long_occlusion_reappear_source: corr_conf
      long_occlusion_reappear_threshold: 0.25

      use_corr_conf: false
      use_relocal_conf: false
      include_occluded: false

evaluation:
  compare_base: true

