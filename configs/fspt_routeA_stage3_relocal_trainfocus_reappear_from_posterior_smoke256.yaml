defaults:
  - fspt_routeA_stage3_relocal_trainfocus_reappear_from_posterior
  - _self_

experiment:
  name: fspt_routeA_stage3_relocal_trainfocus_reappear_from_posterior_smoke256
  description: "Low-memory smoke run for reappearance-focused supervision from posterior checkpoint"

data:
  train:
    max_samples: 256

training:
  epochs: 1
  num_workers: 0

  data_loading:
    use_prefetch: false
    pin_memory: false
    persistent_workers: false

evaluation:
  num_workers: 0

logging:
  wandb:
    enabled: false
  visualize:
    enabled: false
