# =============================================================================
# Online Recovery Real Eval Config
# =============================================================================
# Inherits full relocal config chain + online_recovery adapter.
# Used with eval_long_occlusion_subset.py or debug_online_recovery_real_eval.py
# to verify recovery on real TAP-Vid DAVIS data.

defaults:
  - fspt_online_recovery_smoke_eval256
  - _self_

experiment:
  name: fspt_online_recovery_real_eval256
  description: Real eval of online_recovery adapter on TAP-Vid DAVIS

evaluation:
  compare_base: true
  query_mode: "strided"
  exclude_query_frame: true
  metric_resolution_mode: "input"
  aux_metric_resolution_mode: "original"
  long_occlusion_subset:
    enabled: true
    thresholds: [10, 20, 30]

data:
  val:
    dataset: "tapvid_davis"
    root: "/gemini/code/datasets/tapvid_davis"
    resolution: [256, 256]
    query_stride: 5
