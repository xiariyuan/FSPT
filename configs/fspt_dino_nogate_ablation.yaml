# Ablation: disable relocalization gate (conf_threshold=0, margin_threshold=0, shift_threshold=0)
# Purpose: test if raw DINO step improves anchor when gate doesn't suppress it

defaults:
  - fspt_online_recovery_dino_real_eval256
  - _self_

experiment:
  name: fspt_dino_nogate_ablation
  description: DINO recovery with all relocal gates disabled

model:
  refiner:
    relocalization:
      conf_threshold: 0.0
      gate_power: 1.0
      margin_threshold: 0.0
      margin_power: 1.0
      shift_threshold: 0.0
      shift_power: 1.0
      confirm_enabled: false
    online_recovery:
      search:
        feature_source: "dino"
      retracking:
        enabled: true
        min_conf: 0.001
    retracking:
      enabled: true
      min_conf: 0.001
