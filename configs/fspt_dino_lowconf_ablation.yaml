# Ablation: low conf_threshold to let DINO raw step through
# conf_threshold=0.015 matches DINO relocal_conf (~0.018)
# Also disable confirm mechanism to prevent refinement from pulling back

defaults:
  - fspt_online_recovery_dino_real_eval256
  - _self_

experiment:
  name: fspt_dino_lowconf_ablation

model:
  refiner:
    relocalization:
      conf_threshold: 0.015
      margin_threshold: 0.0
      shift_threshold: 0.0
      confirm_enabled: false
      confirm_dist_threshold: 0.0
    online_recovery:
      search:
        feature_source: "dino"
      retracking:
        enabled: true
        min_conf: 0.001
    retracking:
      enabled: true
      min_conf: 0.001
