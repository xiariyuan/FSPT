experiment:
  name: routeD_cmcp_lmra_v0
  description: >-
    Rank-32 zero-initialized late feature metric residual adapter for the CMCP
    proposal/evidence branch. The native CoTracker trajectory is byte-frozen.

frozen_native_branch:
  cotracker_checkpoint: /gemini/code/FSPT/baselines/cotracker/checkpoints/scaled_online.pth
  trajectory_source: frozen_stage0_sidecars
  candidate_zero_frozen: true
  visibility_confidence_frozen: true
  updateformer_gradients: false
  fnet_gradients: false

initial_checkpoints:
  cmcp: outputs/routeD_cmcp_training_20260717/seed17/best.pt
  cmcp_model_state_sha256: fc3044eb6daa1fb2416164fc0afe58ff5fa4eb4442811ce9c0b4917fbbdb57c0
  comparator: outputs/routeD_cmcp_pairwise_safety_training_20260717/seed17/best.pt
  comparator_model_state_sha256: 46ba80fbb217fd760e009d3bb5a03d43c55c6e3a8dca58e3fb247a00f51e1bcd

adapter:
  class: LateMetricResidualAdapter
  feature_dim: 128
  rank: 32
  trainable_parameters: 8352
  insertion: after_fnet_conv3_before_correlation_normalization
  up_projection_zero_initialized: true

trainable_components:
  lmra: true
  cmcp: true
  comparator: true
  native_tracker: false

discretization:
  proposal_topk: 5
  nms_radius_cells: 1
  ema_alpha: 0.90
  thresholds_tuned: false

protocol:
  fit_gradients_only: true
  model_validation_checkpoint_selection_only: true
  calibration_locked: true
  final_holdout_locked: true
  tapvid_davis_locked: true
  tapvid_kinetics_official_1144_locked: true

formal_gates:
  zero_step_formal_p0h_equality: exact
  native_trajectory_hashes: exact
  candidate_zero_hash: exact
  adapter_rank_and_layer_identity: exact
  seed17_exact_replay: true
  candidate_oracle_AJ_gain_points_min: 3.0
  direct_AJ_gain_points_min: 0.5
  paired_AJ_CI_lower_bound_gt: 0.0
  delta_gain_points_gt: 0.0
  severe_16px_not_worse: true
  harmful_non_native_rate_max: 0.01
