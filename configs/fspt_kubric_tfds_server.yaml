# =============================================================================
# FSPT Kubric TFDS Server Configuration
# =============================================================================
#
# Target environment:
# - Ubuntu 22.04
# - Python 3.11
# - PyTorch 2.x + CUDA 12.x
#
# This config is tuned for running directly on server paths under /gemini/code.
#

defaults:
  - fspt_kubric_tfds
  - _self_

experiment:
  name: "fspt_kubric_tfds_server"
  description: "Server training with Kubric TFDS under /gemini/code/datasets"

data:
  train:
    # Your server TFDS files are under: /gemini/code/datasets/tapvid_kubric/256x256/1.0.0
    root: "/gemini/code/datasets/tapvid_kubric"
    backend: "tfds"
    tfds_name: "movi_e/256x256"
    shuffle_buffer: 1
    shuffle_files: false
    tfds_low_memory: true
    # 64KB 会显著拖慢 TFRecord 读取；1MB 仍然很保守，内存增量可控
    tfds_read_buffer_size: 1048576
    deterministic_sampling: false

  val:
    root: "/gemini/code/datasets/tapvid_kubric"
    backend: "tfds"
    tfds_name: "movi_e/256x256"
    shuffle_buffer: 1
    shuffle_files: false
    tfds_low_memory: true
    tfds_read_buffer_size: 1048576
    deterministic_sampling: true

  pseudo:
    root: "/gemini/code/datasets/tapvid_kubric"
    backend: "tfds"
    tfds_name: "movi_e/256x256"
    shuffle_buffer: 1
    shuffle_files: false
    tfds_low_memory: true
    tfds_read_buffer_size: 1048576

training:
  batch_size: 1
  num_workers: 0
  data_loading:
    use_prefetch: true
    pin_memory: true

evaluation:
  num_workers: 0

hardware:
  gpus: [0]

paths:
  output_dir: "/gemini/code/FSPT/outputs"
  checkpoint_dir: "/gemini/code/FSPT/checkpoints"

logging:
  wandb:
    enabled: false
