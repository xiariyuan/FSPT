manifest_sha256: afd3af1b2af07f8c3483907c94539dc40a7dff5bb290a587eb7db5083953f961

mechanism:
  name: query_closure_identity_energy
  hypothesis: >-
    A correct frame-15 candidate must reverse-track back to the known query
    location and preserve the query identity descriptor through the observed
    path. Closure and identity must agree; generic trajectory smoothness,
    visibility, and confidence can instead reward stable wrong identities.
  normalization: candidate_relative_mean_std_over_valid_candidates
  candidate_relative_zscore_epsilon: 0.0001
  score_formula: >-
    -2*z(reverse_cycle_error_at_query_normalized)
    +z(query_descriptor_cosine_at_query_frame)
    +z(mean_query_descriptor_cosine)
    +z(minimum_query_descriptor_cosine)
  cycle_weight: 2.0
  query_frame_identity_weight: 1.0
  mean_identity_weight: 1.0
  minimum_identity_weight: 1.0
  tie_break: lower_frozen_M1_rank
  trainable_parameters: 0
  learned_residual_forbidden: true

selection:
  mandatory_native_candidate_zero: true
  retained_nonnative: 8
  total_retained_candidates: 9
  label_positive_radius_px: 12.0
  candidate_coordinates_unchanged: true

excluded_from_primary_score:
  - m1_score_z
  - rank_fraction
  - reverse_visibility_probability
  - reverse_confidence_probability
  - descriptor_previous_frame_cosine
  - track_velocity
  - track_acceleration
  - track_jerk
  - distance_from_native_track

controls:
  static_m1: mandatory_native_plus_first_eight_nonnative
  cycle_only: smallest_candidate_relative_cycle_error
  identity_only: >-
    largest sum of query-frame, mean, and minimum identity z-scores

training:
  optimizer: none
  loss: none
  epochs: 0
  checkpoint: none
  checkpoint_selection_used_for_parameter_choice: false
  reason: >-
    The primary mechanism is frozen analytically before reading indices 384--447.
    Checkpoint-selection is therefore an independent confirmation gate, not a
    tuning partition.

