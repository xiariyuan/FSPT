date: 2026-07-20

claim_boundary: >-
  Causal candidate-retention support at frame 15 on preregistered Kubric
  development partitions. This is not coordinate refinement, state restoration,
  future rollout utility, model-validation, DAVIS, Kinetics, or external
  tracking improvement.

